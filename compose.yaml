name: arl

x-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  ARL_MONGO_URL: mongodb://${MONGO_USERNAME:-arl}:${MONGO_PASSWORD:-arl-mongo-change-me}@mongo:27017/?authSource=admin
  ARL_MONGO_DB: ${MONGO_DATABASE:-arl}
  ARL_CELERY_BROKER_URL: amqp://${RABBITMQ_USERNAME:-arl}:${RABBITMQ_PASSWORD:-arl-rabbit-change-me}@rabbitmq:5672/${RABBITMQ_VHOST:-arlv2host}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${ARL_LOG_MAX_SIZE:-10m}
    max-file: ${ARL_LOG_MAX_FILES:-3}

x-api: &api
  image: arl-api:${ARL_IMAGE_TAG:-local}
  pull_policy: never
  restart: unless-stopped
  init: true
  user: "10001:10001"
  environment: *app-environment
  volumes: &api-volumes
    - arl_tmp:/code/app/tmp
    - arl_screenshots:/code/app/tmp_screenshot
  networks:
    - arl_internal
  logging: *default-logging
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-worker: &worker
  image: arl-worker:${ARL_IMAGE_TAG:-local}
  pull_policy: never
  platform: linux/amd64
  restart: unless-stopped
  init: true
  user: "0:10001"
  environment: *app-environment
  volumes:
    - arl_tmp:/code/app/tmp
    - arl_screenshots:/code/app/tmp_screenshot
    - nuclei_cache:/root/nuclei-templates
  networks:
    - arl_internal
  logging: *default-logging
  cap_drop: [ALL]
  cap_add:
    - NET_ADMIN
    - NET_RAW
  security_opt:
    - no-new-privileges:true

services:
  mongo:
    image: mongo:7.0.24
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-arl}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-arl-mongo-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-arl}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - arl_internal
    logging: *default-logging
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    cpus: ${ARL_MONGO_CPUS:-1.5}
    mem_limit: ${ARL_MONGO_MEMORY:-2g}

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-arl}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-arl-rabbit-change-me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-arlv2host}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - arl_internal
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpus: ${ARL_RABBITMQ_CPUS:-1.0}
    mem_limit: ${ARL_RABBITMQ_MEMORY:-1g}

  init:
    <<: *api
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: "no"
    user: "0:0"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - arl_tmp:/code/app/tmp
      - arl_screenshots:/code/app/tmp_screenshot
      - gateway_certs:/etc/nginx/arl-certs
    command:
      - sh
      - -ec
      - |
        chown -R 10001:10001 /code/app/tmp /code/app/tmp_screenshot /etc/nginx/arl-certs
        chmod 0770 /code/app/tmp /code/app/tmp_screenshot
        chmod 0700 /etc/nginx/arl-certs
        exec setpriv --reuid=10001 --regid=10001 --clear-groups python -m app.docker_init
    environment:
      <<: *app-environment
      ARL_ADMIN_USERNAME: ${ARL_ADMIN_USERNAME:-admin}
      ARL_ADMIN_PASSWORD: ${ARL_ADMIN_PASSWORD:-arlpass}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: ${ARL_INIT_CPUS:-1.0}
    mem_limit: ${ARL_INIT_MEMORY:-1g}

  api:
    <<: *api
    command:
      - sh
      - -c
      - exec gunicorn -b 0.0.0.0:5013 app.main:arl_app -w ${ARL_API_WORKERS:-4} --timeout 120 --access-logfile - --error-logfile -
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:5013/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    cpus: ${ARL_API_CPUS:-2.0}
    mem_limit: ${ARL_API_MEMORY:-2g}

  ai:
    <<: *api
    command:
      - gunicorn
      - -b
      - 0.0.0.0:5014
      - app.ai_main:ai_app
      - -w
      - "2"
      - --threads
      - "4"
      - --worker-class
      - gthread
      - --timeout
      - "160"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    environment:
      <<: *app-environment
      ARL_AI_ENABLED: ${ARL_AI_ENABLED:-false}
      ARL_AI_BASE_URL: ${ARL_AI_BASE_URL:-https://api.openai.com/v1}
      ARL_AI_MODEL: ${ARL_AI_MODEL:-}
      ARL_AI_API_KEY: ${ARL_AI_API_KEY:-}
      ARL_AI_TIMEOUT: ${ARL_AI_TIMEOUT:-120}
      ARL_AI_MAX_CONTEXT_BYTES: ${ARL_AI_MAX_CONTEXT_BYTES:-102400}
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:5014/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    cpus: ${ARL_AI_CPUS:-2.0}
    mem_limit: ${ARL_AI_MEMORY:-2g}

  worker:
    <<: *worker
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command:
      - celery
      - -A
      - app.celerytask.celery
      - worker
      - -l
      - info
      - -Q
      - arltask
      - -n
      - arltask@%h
      - -c
      - ${ARL_WORKER_CONCURRENCY:-5}
      - -O
      - fair
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: ${ARL_WORKER_CPUS:-4.0}
    mem_limit: ${ARL_WORKER_MEMORY:-6g}

  github-worker:
    <<: *api
    command:
      - celery
      - -A
      - app.celerytask.celery
      - worker
      - -l
      - info
      - -Q
      - arlgithub
      - -n
      - arlgithub@%h
      - -c
      - ${ARL_GITHUB_WORKER_CONCURRENCY:-3}
      - -O
      - fair
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: ${ARL_GITHUB_WORKER_CPUS:-1.5}
    mem_limit: ${ARL_GITHUB_WORKER_MEMORY:-1g}

  scheduler:
    <<: *api
    command: [python, -m, app.scheduler]
    depends_on:
      init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    cpus: ${ARL_SCHEDULER_CPUS:-0.5}
    mem_limit: ${ARL_SCHEDULER_MEMORY:-512m}

  gateway:
    image: arl-gateway:${ARL_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    ports:
      - ${ARL_PORT:-5003}:5003
    volumes:
      - gateway_certs:/etc/nginx/arl-certs
      - ./docker/certs:/etc/nginx/trusted-certs:ro
    networks:
      - arl_internal
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fkSs, https://127.0.0.1:5003/healthz]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: ${ARL_GATEWAY_CPUS:-0.5}
    mem_limit: ${ARL_GATEWAY_MEMORY:-256m}

  mongo-backup:
    image: mongo:7.0.24
    profiles: [backup]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MONGO_BACKUP_URI: mongodb://${MONGO_USERNAME:-arl}:${MONGO_PASSWORD:-arl-mongo-change-me}@mongo:27017/${MONGO_DATABASE:-arl}?authSource=admin
      MONGO_BACKUP_INTERVAL_SECONDS: ${MONGO_BACKUP_INTERVAL_SECONDS:-86400}
      MONGO_BACKUP_RETENTION_DAYS: ${MONGO_BACKUP_RETENTION_DAYS:-14}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          mongodump --uri="$$MONGO_BACKUP_URI" --archive="/backup/arl-$$stamp.archive.gz" --gzip
          find /backup -type f -name 'arl-*.archive.gz' -mtime +"$$MONGO_BACKUP_RETENTION_DAYS" -delete
          sleep "$$MONGO_BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - mongo_backups:/backup
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - arl_internal
    logging: *default-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: ${ARL_BACKUP_CPUS:-1.0}
    mem_limit: ${ARL_BACKUP_MEMORY:-1g}

networks:
  arl_internal:
    driver: bridge

volumes:
  mongo_data:
  rabbitmq_data:
  arl_tmp:
  arl_screenshots:
  nuclei_cache:
  gateway_certs:
  mongo_backups:
