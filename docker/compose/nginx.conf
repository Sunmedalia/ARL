worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream arl_api {
        server api:5013;
        keepalive 16;
    }

    upstream arl_ai {
        server ai:5014;
        keepalive 8;
    }

    server {
        listen 5003 ssl;
        server_name _;

        ssl_certificate /etc/nginx/arl-certs/arl.crt;
        ssl_certificate_key /etc/nginx/arl-certs/arl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ARL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /next {
            return 302 /next/;
        }

        location /next/ {
            try_files $uri $uri/ /next/index.html;
        }

        location = /legacy {
            return 302 /legacy/;
        }

        location = /legacy/ {
            try_files /index.html =404;
        }

        location /api/ai/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_pass http://arl_ai;
        }

        location /api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_pass http://arl_api;
        }

        location /swaggerui/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://arl_api;
        }

        location / {
            try_files $uri $uri/ /index.html;
            index index.html;
        }
    }
}
