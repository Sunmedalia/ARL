name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tools/ARL-NPoC/requirements.txt ./tools/ARL-NPoC
      - name: Compile Python
        run: python -m compileall app arl_tool test
      - name: Run offline unit tests
        run: python -m unittest discover -s test -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build console
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config -q

  scanner-image:
    runs-on: ubuntu-latest
    needs: unit-and-frontend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 scanner Worker
        run: docker compose build worker
      - name: Verify scanner runtime
        run: |
          docker run --rm --user 0:10001 \
            --cap-drop ALL --cap-add NET_RAW --cap-add NET_ADMIN \
            arl-worker:local sh -ec '
              test "$(id -u):$(id -g)" = "0:10001"
              command -v nmap ncrack nuclei wih phantomjs >/dev/null
              python -c "import xing, app.celerytask; print(\"worker-runtime-ok\")"
            '

  compose-smoke:
    runs-on: ubuntu-latest
    needs: unit-and-frontend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight runtime images
        run: docker compose build init gateway
      - name: Start core services
        run: docker compose up -d mongo rabbitmq init api ai gateway
      - name: Wait for gateway health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --insecure --silent https://127.0.0.1:5003/healthz; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          docker compose logs --no-color init api ai gateway
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color mongo rabbitmq init api ai gateway
      - name: Stop services
        if: always()
        run: docker compose down -v
